name: Daily News Digest

on:
  schedule:
    # 21:00 UTC = 翌 06:00 JST。7:00 JST の予定作成までに余裕を確保。
    # GitHub Actions の定期実行は数分〜十数分の遅延があることに注意。
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Run Claude Code to build digest.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat prompts/news-digest.md)" \
            --allowedTools "WebSearch,WebFetch,Write" \
            --permission-mode acceptEdits \
            --output-format json \
            > claude-output.json

      - name: Verify digest.json exists
        run: |
          if [ ! -f digest.json ]; then
            echo "ERROR: digest.json was not created by Claude Code."
            echo "---- claude-output.json (tail) ----"
            tail -n 200 claude-output.json || true
            exit 1
          fi
          echo "digest.json created successfully."
          wc -c digest.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create Google Calendar event
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python scripts/create_calendar_event.py
